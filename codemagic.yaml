# Codemagic builds for gearloop. See docs/codemagic.md for the one-time setup.
#
# gearloop-check  runs on every push: tests, plus unsigned iPhone-simulator and Mac builds.
#                 Needs no Apple account, so it is the first thing to get green.
# gearloop-ios    started by hand: signed iPhone build uploaded to TestFlight.
# gearloop-mac-monterey-check
#                 started by hand: unsigned Mac build on the older Xcode 26.6 tools so the
#                 Mac app runs on macOS 12 Monterey (the Xcode 27 tools need macOS 14).

definitions:
  scripts:
    # .NET for iOS and Mac only builds with the exact Xcode major.minor it was made for, so each
    # workflow pins WORKLOAD_SET and xcode: together. Workload sets are written in CLI form
    # (10.0.113 is NuGet package version 10.113.0):
    #   10.0.113  iOS and Mac Catalyst 27.0, MAUI 10.0.110  ->  xcode: 27.0
    # The Xcode a pack needs is its _RecommendedXcodeVersion, which can differ from the pack name.
    #   10.0.112  iOS and Mac Catalyst 26.5, MAUI 10.0.20   ->  xcode: 26.6 (Mac app runs on macOS 12)
    # To upgrade, pick a newer set whose iOS and MacCatalyst versions match, and change xcode: to match.
    - &install_dotnet
      name: Install .NET 10 and the MAUI workloads
      script: |
        set -euxo pipefail
        curl -sSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
        chmod +x dotnet-install.sh
        ./dotnet-install.sh --channel 10.0.1xx --install-dir "$DOTNET_PATH"
        # Pin the workload set first, then install the workloads from it without updating.
        "$DOTNET" workload config --update-mode workload-set
        "$DOTNET" workload update --version "$WORKLOAD_SET"
        "$DOTNET" workload install maui-ios maui-maccatalyst --skip-manifest-update
        "$DOTNET" workload list
        xcodebuild -version

workflows:
  gearloop-check:
    name: gearloop check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 27.0
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/.dotnet
        DOTNET: $CM_BUILD_DIR/.dotnet/dotnet
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        WORKLOAD_SET: 10.0.113
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: '*'
    scripts:
      - *install_dotnet
      - name: Run tests
        script: |
          "$DOTNET" test tests/Gearloop.Tests --logger "trx;LogFileName=results.trx" --results-directory test-results
        test_report: test-results/results.trx
      - name: Build for iPhone simulator
        script: |
          "$DOTNET" build src/Gearloop.App -f net10.0-ios -c Debug -p:RuntimeIdentifier=iossimulator-arm64
      - name: Build for Mac
        script: |
          "$DOTNET" build src/Gearloop.App -f net10.0-maccatalyst -c Debug

  gearloop-ios:
    name: gearloop iOS to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 90
    integrations:
      # The name you give the App Store Connect API key in Codemagic's Team integrations.
      app_store_connect: gearloop-asc
    environment:
      xcode: 27.0
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.marcchenard.gearloop
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/.dotnet
        DOTNET: $CM_BUILD_DIR/.dotnet/dotnet
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        WORKLOAD_SET: 10.0.113
        # The numeric Apple ID of the app, from App Store Connect > App Information.
        APP_STORE_APPLE_ID: "0000000000"
        APP_VERSION: "0.1.0"
    scripts:
      - *install_dotnet
      - name: Run tests
        script: |
          "$DOTNET" test tests/Gearloop.Tests
      - name: Build signed .ipa
        script: |
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" || true)
          if [ -z "$LATEST" ]; then BUILD=$BUILD_NUMBER; else BUILD=$((LATEST + 1)); fi

          # dotnet publish needs the certificate and profile by name; Codemagic installed them
          # from the ios_signing settings above.
          CERT_NAME=$(keychain list-certificates | jq -r '.[0].common_name')
          PROFILE_NAME=$(find ~/Library/MobileDevice/Provisioning\ Profiles -name "*.mobileprovision" \
            -execdir sh -c '/usr/libexec/PlistBuddy -c "print :Name" /dev/stdin <<< $(security cms -D -i {})' \; | head -n 1)
          echo "Signing with '$CERT_NAME' and profile '$PROFILE_NAME', build $BUILD"

          "$DOTNET" publish src/Gearloop.App -f net10.0-ios -c Release \
            -p:RuntimeIdentifier=ios-arm64 \
            -p:BuildIpa=true \
            -p:ApplicationDisplayVersion="$APP_VERSION" \
            -p:ApplicationVersion="$BUILD" \
            -p:CodesignKey="$CERT_NAME" \
            -p:CodesignProvision="$PROFILE_NAME" \
            -o artifacts
    artifacts:
      - artifacts/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Builds go to internal testers (you) without Apple's beta review.
        submit_to_testflight: false

  gearloop-mac-monterey-check:
    name: gearloop Mac (Monterey) check
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 26.6
      vars:
        DOTNET_PATH: $CM_BUILD_DIR/.dotnet
        DOTNET: $CM_BUILD_DIR/.dotnet/dotnet
        DOTNET_CLI_TELEMETRY_OPTOUT: 1
        WORKLOAD_SET: 10.0.112
    scripts:
      - *install_dotnet
      - name: Build for Mac (macOS 12 and newer)
        script: |
          set -euo pipefail
          # Intel build (Macs that stay on Monterey are Intel). Unsigned, for running locally:
          # unzip, then right-click the app and choose Open the first time.
          "$DOTNET" build src/Gearloop.App -f net10.0-maccatalyst -c Debug \
            -p:GearloopMacCatalystMinimum=15.0 \
            -p:RuntimeIdentifier=maccatalyst-x64 \
            -p:EnableCodeSigning=false
          APP=$(find src/Gearloop.App/bin/Debug/net10.0-maccatalyst/maccatalyst-x64 -maxdepth 1 -name "*.app" | head -n 1)
          echo "Built $APP"
          mkdir -p artifacts
          ditto -c -k --keepParent "$APP" artifacts/gearloop-mac-intel.zip
    artifacts:
      - artifacts/*.zip
